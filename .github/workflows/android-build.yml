name: Android Build (CI)

on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: 'Gradle task'
        required: true
        default: 'assembleDebug'
        type: choice
        options:
          - assembleDebug
          - ':app:assembleNightly'
          - ':app:assembleClone'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Configure SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Temporarily hide NDK/ffmpeg source files
        run: |
          cd app/src/main/java
          for f in \
            com/ai/assistance/operit/api/chat/llmprovider/AIServiceFactory.kt \
            com/ai/assistance/operit/api/chat/llmprovider/LlamaProvider.kt \
            com/ai/assistance/operit/api/chat/llmprovider/MNNProvider.kt \
            com/ai/assistance/operit/api/speech/SherpaMnnSpeechProvider.kt \
            com/ai/assistance/operit/core/avatar/impl/dragonbones/control/DragonBonesAvatarController.kt \
            com/ai/assistance/operit/core/avatar/impl/dragonbones/model/DragonBonesAvatarModel.kt \
            com/ai/assistance/operit/core/avatar/impl/dragonbones/view/DragonBonesRenderer.kt \
            com/ai/assistance/operit/core/avatar/impl/fbx/control/FbxAvatarController.kt \
            com/ai/assistance/operit/core/avatar/impl/fbx/model/FbxAvatarModel.kt \
            com/ai/assistance/operit/core/avatar/impl/fbx/view/FbxRenderer.kt \
            com/ai/assistance/operit/core/avatar/impl/mmd/control/MmdAvatarController.kt \
            com/ai/assistance/operit/core/avatar/impl/mmd/model/MmdAvatarModel.kt \
            com/ai/assistance/operit/core/avatar/impl/mmd/view/MmdRenderer.kt \
            com/ai/assistance/operit/core/avatar/impl/factory/AvatarControllerFactoryImpl.kt \
            com/ai/assistance/operit/core/avatar/impl/factory/AvatarModelFactoryImpl.kt \
            com/ai/assistance/operit/core/avatar/impl/factory/AvatarRendererFactoryImpl.kt \
            com/ai/assistance/operit/core/tools/defaultTool/standard/StandardFFmpegTool.kt \
            com/ai/assistance/operit/core/tools/javascript/JsEngine.kt \
            com/ai/assistance/operit/ui/components/ManagedDragonBonesView.kt \
            com/ai/assistance/operit/ui/features/assistant/screens/AssistantConfigScreen.kt \
            com/ai/assistance/operit/ui/features/settings/screens/MnnModelDownloadScreen.kt \
            com/ai/assistance/operit/util/LatexMathMlConverter.kt \
            com/ai/assistance/operit/util/ToolPkgJsAstMinifier.kt \
          ; do
            [ -f "$f" ] && mv "$f" "$f.bak" && echo "renamed: $f" || echo "skip: $f"
          done
          echo '=== Rename done ==='
      - name: Build
        run: ./gradlew ${{ github.event.inputs.gradle_task }} --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: operit-apk-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14